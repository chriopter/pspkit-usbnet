[package]
name = "pspkit-usbnetd"
version = "0.1.1"
edition = "2024"
description = "User-mode gateway (ARP, DHCP, DNS, TCP/UDP NAT) for Ethernet over the PSP's USB cable"
license = "MIT"

[lib]
name = "pspkit_usbnetd"
path = "src/lib.rs"

[[bin]]
name = "pspkit-usbnetd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
mio = { version = "1", features = ["os-poll", "net"] }
# libusb is compiled in: the executable needs nothing installed.
rusb = { version = "0.9", features = ["vendored"] }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }

[dev-dependencies]
# The tests play the PSP with a second smoltcp instance on an Ethernet medium.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4"] }

[profile.release]
opt-level = 3
lto = true
strip = true

# The 20 MB transfer test should measure the gateway, not an unoptimised build.
[profile.test]
opt-level = 2
