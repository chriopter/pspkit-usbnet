<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 80" width="144" height="80">
<!-- The store icon (PSP ICON0, 144x80): the USB sign whose shaft runs on as the equator of a globe. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061427"/><stop offset="1" stop-color="#02060d"/></linearGradient>
<linearGradient id="gc" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="134" y2="0"><stop offset="0" stop-color="#5dff9a"/><stop offset=".55" stop-color="#4fe6c8"/><stop offset="1" stop-color="#39d0ff"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="144" height="80" fill="url(#bg)"/>
<g transform="translate(13.5 -6) scale(.81)" filter="url(#glow)" fill="none" stroke="url(#gc)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
<circle cx="14" cy="40" r="5" fill="#5dff9a" stroke="none"/>
<path d="M14 40H130"/>
<path d="M34 40l10-13h13"/><rect x="57" y="23.5" width="7" height="7" fill="#57f2b0" stroke="none"/>
<path d="M46 40l10 13h11"/><circle cx="70.5" cy="53" r="3.6" fill="#52ecbc" stroke="none"/>
<circle cx="110" cy="40" r="20"/><ellipse cx="110" cy="40" rx="9" ry="20"/>
<path d="M93 30H127"/><path d="M93 50H127"/>
</g>
<text x="72" y="71" text-anchor="middle" font-family="Liberation Sans,Arial,sans-serif" font-style="italic" font-weight="700" font-size="12.5" letter-spacing=".4" fill="#d8fff0" filter="url(#soft)">Hi-Speed USBNet</text>
</svg>
